<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 · 这条路没有便利店</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0a0b0f">
  <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="%230a0b0f"/><rect x="7" y="10" width="18" height="12" rx="2" fill="none" stroke="%23d9a441" stroke-width="2"/><rect x="12" y="14.5" width="8" height="3" rx="1.5" fill="%23d9a441"/></svg>'>
  <style>
    :root {
      --bg: #0a0b0f;
      --line: rgba(255, 255, 255, .075);
      --line-2: rgba(255, 255, 255, .17);
      --fg: #e9eaef;
      --fg-2: #9ba0ad;
      --fg-3: #6b7080;
      --accent: #d9a441;
      --sans: "Geist", "Outfit", ui-sans-serif, system-ui, -apple-system, "Segoe UI",
        "PingFang SC", "HarmonyOS Sans SC", "Source Han Sans SC", "Microsoft YaHei", sans-serif;
      --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas,
        "Cascadia Mono", monospace;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      background: var(--bg);
      color: var(--fg);
      font: 15px/1.75 var(--sans);
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: "";
      position: fixed;
      inset: -20% -10% 0;
      pointer-events: none;
      opacity: .5;
      background: radial-gradient(56% 60% at 18% 12%, rgba(217, 164, 65, .085), transparent 62%);
    }

    .wrap {
      position: relative;
      width: 100%;
      max-width: 1180px;
      margin: 0 auto;
      padding: 0 30px;
    }

    .code {
      font-family: var(--mono);
      font-size: 11.5px;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--fg-3);
      margin: 0 0 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(26px, 3.4vw, 38px);
      line-height: 1.28;
      font-weight: 600;
      letter-spacing: -.02em;
    }

    p {
      margin: 20px 0 0;
      max-width: 46ch;
      font-size: 15.5px;
      line-height: 1.85;
      color: var(--fg-2);
    }

    .cta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 30px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      padding: 11px 20px;
      border: 1px solid var(--line-2);
      border-radius: 999px;
      font-size: 14px;
      color: var(--fg);
      text-decoration: none;
      background: rgba(255, 255, 255, .02);
      transition: background .18s ease, border-color .18s ease;
    }

    .btn:hover {
      background: #15171e;
      border-color: rgba(255, 255, 255, .28);
    }

    .btn-p {
      background: var(--accent);
      border-color: transparent;
      color: #14100a;
      font-weight: 500;
    }

    .btn-p:hover { background: #e3b158; }

    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  </style>
</head>

<body>
  <div class="wrap">
    <p class="code">404 — 页面不存在</p>
    <h1>这条路没有便利店。</h1>
    <p>
      你找的地址不在这里，可能是链接写错了一个字，也可能是我把它挪走了。
      回首页的话，那边至少还有一场雨在下。
    </p>
    <div class="cta">
      <a class="btn btn-p" href="/">回首页</a>
      <a class="btn" href="/#works">看作品</a>
    </div>
  </div>
</body>

</html>
